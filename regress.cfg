# Regression Simulation Configuration File
# Format: key = value

# ===========================================
# Parallel Configuration
# ===========================================

# Number of parallel jobs (default: 1)
jobs = 4

# Number of retries on failure (default: 0)
retry = 1

# Timeout for single simulation in hours (default: 1)
timeout = 1

# ===========================================
# Test Case Configuration
# ===========================================

# Test case list file (default: case.lst)
case_list = case.lst

# UVM print level (default: UVM_MEDIUM)
# Options: UVM_LOW, UVM_MEDIUM, UVM_HIGH, UVM_FULL, UVM_DEBUG
pl = UVM_MEDIUM

# ===========================================
# Coverage Configuration
# ===========================================

# Enable coverage collection (default: true)
coverage = true

# Coverage arguments for VCS
# Default: -cm line+cond+branch+fsm+tgl+assert
coverage_args = -cm line+cond+branch+fsm+tgl+assert

# Generate URG coverage report (default: false)
urg_report = false

# ===========================================
# Result Judgment
# ===========================================

# Regex pattern for failure keywords in logs
# Matches UVM Report Summary counts (not individual log lines)
# Default: UVM_FATAL : N (N>0) | UVM_ERROR : N (N>0)
fail_keywords = UVM_FATAL\s*:\s*[1-9]\d*|UVM_ERROR\s*:\s*[1-9]\d*|.*TEST_CASE_FAIL.*|Error-.*

# Regex pattern for pass keywords in logs
pass_keywords =.*TEST_CASE_PASS.*
# ===========================================
# Global Arguments
# ===========================================

# Global make arguments applied to all cases
# Example: USE_VCS=1 VERBOSITY=UVM_HIGH
global_args =
